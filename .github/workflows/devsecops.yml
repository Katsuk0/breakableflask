
name: Automatisation des tests DevSecOps

on:
  push:
    branches:
      - main
      - master

jobs:

  Dependances:
    name: Analyse des dépendances
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Analyse des dépendances avec Trivy
        run: |
          docker run --rm \
            -v "$PWD":/project \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:latest fs \
            --exit-code 1 \
            /project/requirements.txt

  Dockerfile:
    name: Construction et analyse de l'image Docker
    runs-on: ubuntu-latest
    needs: Dependances

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Construction de l'image Docker
        run: |
          docker build -t imgvulne:1.1 .

      - name: Analyse de l'image avec Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            imgvulne:1.1

  Deploy:
    name: Préparation du déploiement
    runs-on: ubuntu-latest
    needs: Dockerfile

    steps:
      - name: Deploy
        run: |
          echo "Les contrôles DevSecOps sont terminés."
          echo "Votre application est prête à être déployée."
